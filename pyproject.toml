[project]
name = "control-clock"
version = "0.1.0"
description = "CPU time to solve control tasks, including startup and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "gymnasium[box2d]==1.2.1",
  "swig==4.3.1",
  "torch==2.8.0+cpu",
  "stable-baselines3==2.7.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv.extra-build-dependencies]
box2d-py = ["swig==4.3.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
